name: Desktop release candidates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npx electron-builder --mac zip --publish never
          - os: windows-latest
            command: npx electron-builder --win portable --publish never
          - os: ubuntu-latest
            command: npx electron-builder --linux AppImage --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:steam
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: apex-evolve-${{ runner.os }}
          path: release/steam/*
